<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
  <title>Меню | Кафе «Самегрело»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --deep-brown: #1E1410; --gold: #D4AF37; --soft-gold: #E5C76B;
      --cream: #F5E9DB; --light-cream: #FFF6EC; --text-muted: #B7A692;
      --card-border: rgba(212, 175, 55, 0.15); --radius-xl: 24px; --radius-lg: 18px;
      --font-heading: 'Playfair Display', serif; --font-body: 'Inter', sans-serif;
      --transition: 0.3s ease;
    }
    html { scroll-behavior: smooth; background-color: var(--deep-brown); }
    body { font-family: var(--font-body); background-color: var(--deep-brown); color: var(--cream); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    .container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 24px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 16px 32px; border-radius: 50px; font-weight: 600; font-size: 1rem;
      background: transparent; border: 1px solid transparent; cursor: pointer;
      transition: all var(--transition); white-space: nowrap; backdrop-filter: blur(4px);
    }
    .btn-primary { background: linear-gradient(135deg, #E5C76B 0%, #C59B3C 100%); color: #1E1410; border: none; }
    .btn-primary:hover { background: linear-gradient(135deg, #F3D87A 0%, #D4AF37 100%); transform: translateY(-2px); }

    /* Header */
    .site-header { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; padding: 16px 0; background: rgba(30, 20, 16, 0.8); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(255,255,240,0.06); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 1.9rem; font-weight: 700; color: var(--gold); }
    .back-link { color: var(--soft-gold); font-weight: 500; }

    /* Menu Page */
    .menu-page { padding: 130px 0 80px; }
    .section-title { font-family: var(--font-heading); font-size: clamp(2.2rem, 6vw, 3.2rem); color: var(--light-cream); text-align: center; margin-bottom: 1.8rem; }
    .search-box { display: flex; justify-content: center; margin-bottom: 30px; }
    .search-box input { width: 100%; max-width: 400px; padding: 14px 20px; border-radius: 50px; border: 1px solid rgba(212,175,55,0.3); background: rgba(255,255,240,0.05); color: var(--cream); font-size: 1rem; outline: none; }
    .search-box input::placeholder { color: var(--text-muted); }
    .menu-tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 35px; }
    .menu-tab { padding: 12px 24px; border-radius: 40px; background: transparent; border: 1px solid rgba(255,255,240,0.15); color: var(--cream); font-weight: 500; cursor: pointer; transition: var(--transition); font-size: 0.95rem; }
    .menu-tab.active { background: var(--gold); color: #1E1410; border-color: var(--gold); font-weight: 700; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 10px; }
    .menu-card { background: rgba(44, 31, 23, 0.7); backdrop-filter: blur(10px); border: 1px solid var(--card-border); border-radius: var(--radius-lg); overflow: hidden; transition: all var(--transition); }
    .menu-card:hover { border-color: var(--gold); transform: translateY(-5px); }
    .menu-card-img { height: 160px; overflow: hidden; background: #2C1F17; }
    .menu-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .menu-card-body { padding: 22px 20px; }
    .menu-card-body h3 { font-size: 1.25rem; margin-bottom: 4px; color: #FFF6EC; }
    .menu-weight { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; }
    .menu-price { font-weight: 700; font-size: 1.4rem; color: var(--gold); }
    .back-btn { display: block; text-align: center; margin: 40px 0; }

    @media (max-width: 480px) { .container { padding: 0 18px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Самегрело</a>
      <a href="index.html" class="back-link">← На главную</a>
    </div>
  </header>

  <main class="menu-page container">
    <h2 class="section-title">Наше меню</h2>
    <div class="search-box"><input type="text" id="menuSearch" placeholder="🔍 Поиск блюда..."></div>
    <div class="menu-tabs" id="menuTabs">
      <button class="menu-tab active" data-category="all">Все</button>
      <button class="menu-tab" data-category="fastfood">Фастфуд</button>
      <button class="menu-tab" data-category="baking">Выпечка и Пицца</button>
      <button class="menu-tab" data-category="soups">Супы и Горячее</button>
      <button class="menu-tab" data-category="salads">Салаты и Закуски</button>
    </div>
    <div class="menu-grid" id="menuGrid"></div>
    <div class="back-btn"><a href="index.html" class="btn btn-primary">← Вернуться на главную</a></div>
  </main>

  <script>
    (function() {
      const menuItems = [
        { name:"Шаурма со свининой", weight:"450 г", price:"490 ₽", cat:"fastfood" },
        { name:"Сувлук развернутый", weight:"450 г", price:"470 ₽", cat:"fastfood" },
        { name:"Шаурма с курицей (Большая)", weight:"450 г", price:"450 ₽", cat:"fastfood" },
        { name:"Клаб-сэндвич", weight:"450 г", price:"430 ₽", cat:"fastfood" },
        { name:"Сувлак в пите", weight:"400 г", price:"420 ₽", cat:"fastfood" },
        { name:"Ролл Цезарь", weight:"400 г", price:"380 ₽", cat:"fastfood" },
        { name:"Шаурма с курицей (Стандарт)", weight:"300 г", price:"370 ₽", cat:"fastfood" },
        { name:"Сувлак в лаваше", weight:"300 г", price:"350 ₽", cat:"fastfood" },
        { name:"Ролл Наггетс", weight:"300 г", price:"350 ₽", cat:"fastfood" },
        { name:"Гамбургер с курицей", weight:"250 г", price:"310 ₽", cat:"fastfood" },
        { name:"Пицца «Цезарь»", weight:"500 г", price:"500 ₽", cat:"baking" },
        { name:"Хачапури по-мегрельски", weight:"450 г", price:"450 ₽", cat:"baking" },
        { name:"Хачапури по-имеретински", weight:"400 г", price:"400 ₽", cat:"baking" },
        { name:"Хачапури по-аджарски", weight:"350 г", price:"350 ₽", cat:"baking" },
        { name:"Хашлама", weight:"350 г", price:"680 ₽", cat:"soups" },
        { name:"Долма с соусом мацони", weight:"250 г", price:"450 ₽", cat:"soups" },
        { name:"Люля-кебаб из курицы", weight:"200 г", price:"390 ₽", cat:"soups" },
        { name:"Суп Харчо", weight:"350 г", price:"380 ₽", cat:"soups" },
        { name:"Суп-лапша с курицей", weight:"350 г", price:"320 ₽", cat:"soups" },
        { name:"Хинкали классические (вар.)", weight:"1 шт.", price:"90 ₽", cat:"soups" },
        { name:"Хинкали жареные", weight:"1 шт.", price:"100 ₽", cat:"soups" },
        { name:"Салат «Тбилиси»", weight:"150 г", price:"720 ₽", cat:"salads" },
        { name:"Салат «Принц»", weight:"150 г", price:"700 ₽", cat:"salads" },
        { name:"Салат «Греческий»", weight:"250 г", price:"600 ₽", cat:"salads" },
        { name:"Салат «Цахтон с говядиной»", weight:"250 г", price:"520 ₽", cat:"salads" },
        { name:"Салат «Цезарь с курицей»", weight:"250 г", price:"450 ₽", cat:"salads" },
        { name:"Салат «Газапхули»", weight:"200 г", price:"350 ₽", cat:"salads" },
        { name:"Ассорти из домашних солений", weight:"300 г", price:"350 ₽", cat:"salads" },
        { name:"Сырные шарики", weight:"5 шт.", price:"300 ₽", cat:"salads" }
      ];

      const menuGrid = document.getElementById('menuGrid');
      const tabs = document.querySelectorAll('.menu-tab');
      const searchInput = document.getElementById('menuSearch');
      let currentCategory = 'all';

      function renderMenu(category = 'all', searchTerm = '') {
        if (!menuGrid) return;
        let filtered = category === 'all' ? menuItems : menuItems.filter(item => item.cat === category);
        if (searchTerm) {
          filtered = filtered.filter(item => item.name.toLowerCase().includes(searchTerm.toLowerCase()));
        }
        menuGrid.innerHTML = filtered.map(item => {
          const globalIndex = menuItems.findIndex(m => m.name === item.name);
          return `<div class="menu-card"><div class="menu-card-img"><img src="./${globalIndex + 1}.jpg" alt="${item.name}" loading="lazy"></div><div class="menu-card-body"><h3>${item.name}</h3><div class="menu-weight">${item.weight}</div><div class="menu-price">${item.price}</div></div></div>`;
        }).join('');
      }

      tabs.forEach(tab => {
        tab.addEventListener('click', function() {
          tabs.forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentCategory = this.dataset.category;
          renderMenu(currentCategory, searchInput.value);
        });
      });

      searchInput.addEventListener('input', function() {
        renderMenu(currentCategory, this.value);
      });

      renderMenu('all');
    })();
  </script>
</body>
</html>
